name: tagarela
description: "Tagarela: inglês de verdade, tirado das conversas do seu dia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

workspace:
  - packages/on_device_extraction

dependencies:
  audioplayers: ^6.8.1
  country_flags: ^4.1.2
  crypto: ^3.0.7
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  on_device_extraction:
    path: packages/on_device_extraction
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  record: ^7.1.2
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_sign_in_platform_interface: ^3.1.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
