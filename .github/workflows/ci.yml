name: Esteira

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  check:
    name: Formato, análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (lockfile travado)
        run: flutter pub get --enforce-lockfile

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Análise
        run: flutter analyze

      - name: Código sem uso
        run: dart run dart_code_linter:metrics check-unused-code lib packages test --analyze-private-members --analyze-public-members

      - name: Arquivo sem uso
        run: dart run dart_code_linter:metrics check-unused-files lib test

      - name: Testes
        run: flutter test --coverage

      - name: Cobertura no resumo
        run: |
          awk -F: '/^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
            END { printf "### Cobertura\n%.1f%% (%d de %d linhas)\n", lh * 100 / lf, lh, lf }' \
            coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7

  repeticao:
    name: Código repetido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: jscpd
        run: npx --yes jscpd@5.4.1 lib test packages --format dart --ignore "**/*.g.dart,**/generated/**,**/country_names.dart" --threshold 0 --reporters console-full

  vulnerabilidades:
    name: Dependências vulneráveis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (lockfile travado)
        run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: Build iOS
    needs: check
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências (lockfile travado)
        run: flutter pub get --enforce-lockfile

      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign
